name: CI-Pipeline
on:
  push:
  pull_request:

jobs:
  Build:
    runs-on: self-hosted
    steps:
        - uses: actions/checkout@v5
        - name: Use Node.js
          uses: actions/setup-node@v4
          with:
           node-version: '20.x'
        - run: npm install
        - run: npm start
    
     

